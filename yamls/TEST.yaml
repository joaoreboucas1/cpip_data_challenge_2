timing: True
debug: False
stop_at_error: False
output: ./projects/cpip_data_challenge_2/chains/TEST

likelihood:
  roman_real.cosmic_shear:
    use_emulator: 0
    path: ./projects/cpip_data_challenge_2/data
    data_file: DC2.dataset
    accuracyboost: 1.0
    integration_accuracy: 0
    lmax: 75000
    kmax_boltzmann: 7.5
    # 1 EE2, 2 Halofit
    non_linear_emul: 2
    IA_model: 0  # NLA (0) or TATT (1)
    IA_code: 0    # CFASTPT (0) or FASTPT (1) (only works if not NLA)
    IA_redshift_evolution: 3
    ggl_exclude: [[6,0], [7,0], [7,1]]
    debug: false
    use_baryon_pca: false
    create_baryon_pca: false
    baryon_pca_select_sims: "antilles-2-99/antilles-101-378/antilles-380-400"
    filename_baryon_pca: "./projects/lsst_y1/chains/pca.txt"

params: !defaults
  - params_cosmo_lcdm
  - params_source_NLA

theory:
  camb:
    path: ./external_modules/code/CAMB
    stop_at_error: False
    use_renames: True
    extra_args:
      halofit_version: takahashi
      AccuracyBoost: 1.05
      lens_potential_accuracy: 1.0
      dark_energy_model: ppf
      accurate_massive_neutrino_transfers: false
      k_per_logint: 15
      kmax: 7.5

sampler:
  evaluate:
    N: 1
    override:
      As_1e9: 2.1
      ns: 0.96605
      H0: 67.32
      omegab: 0.04
      omegam: 0.3
      mnu: 0.06
      w0pwa: -1.0
      w: -1.0
      roman_DZ_S1: 0.0
      roman_DZ_S2: 0.0
      roman_DZ_S3: 0.0
      roman_DZ_S4: 0.0
      roman_DZ_S5: 0.0
      roman_DZ_S6: 0.0
      roman_DZ_S7: 0.0
      roman_DZ_S8: 0.0
      roman_M1: 0.0
      roman_M2: 0.0
      roman_M3: 0.0
      roman_M4: 0.0
      roman_M5: 0.0
      roman_M6: 0.0
      roman_M7: 0.0
      roman_M8: 0.0
      roman_A1_1: 0.6
      roman_A1_2: -1.5
      # TATT PARAMETERS
      roman_A2_1: 0.0
      roman_BTA_1: 0.0
      #roman_A2_1: 0.05
      #roman_BTA_1: 0.001
      roman_A2_2: -1.51541