timing: True
debug: False
stop_at_error: False
output: ./projects/cpip_data_challenge_2/chains/BPCA_VAL_2

likelihood:
  roman_real.cosmic_shear:
    use_emulator: 0
    path: ./projects/cpip_data_challenge_2/data
    data_file: DC2.dataset
    data_vector_file: ./projects/cpip_data_challenge_2/data/scale_cuts/NOBARYONS.modelvector
    accuracyboost: 1.0
    integration_accuracy: 0
    lmax: 75000
    kmax_boltzmann: 7.5
    # 1 EE2, 2 Halofit
    non_linear_emul: 2
    IA_model: 0  # NLA (0) or TATT (1)
    IA_code: 0    # CFASTPT (0) or FASTPT (1) (only works if not NLA)
    IA_redshift_evolution: 3
    

params: !defaults
  - params_cosmo_lcdm
  - params_source_NLA

theory:
  camb:
    path: ./external_modules/code/CAMB
    stop_at_error: False
    use_renames: True
    extra_args:
      halofit_version: takahashi
      AccuracyBoost: 1.05
      lens_potential_accuracy: 1.0
      dark_energy_model: ppf
      accurate_massive_neutrino_transfers: false
      k_per_logint: 15
      kmax: 7.5

sampler:
  mcmc:
    covmat: 
    covmat_params:
    learn_proposal: True
    learn_proposal_Rminus1_min: 0.03
    learn_proposal_Rminus1_max: 150
    learn_proposal_Rminus1_max_early: 300.
    max_samples: .inf
    Rminus1_stop: 0.02
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    measure_speeds: False
    drag: False
    oversample_power: 0.2
    oversample_thin: True
    blocking:
    - [1,
        [
          As_1e9, ns, H0, omegab, omegam
        ]
      ]
    - [6,
        [
          roman_DZ_S1, roman_DZ_S2, roman_DZ_S3, roman_DZ_S4, 
          roman_DZ_S5, roman_DZ_S6, roman_DZ_S7, roman_DZ_S8,
          roman_A1_1, roman_A1_2
        ]
      ]
    - [25,
        [
          roman_M1, roman_M2, roman_M3, roman_M4, 
          roman_M5, roman_M6, roman_M7, roman_M8, roman_BARYON_Q1
        ]
      ]
    learn_every: 10d
    max_tries: .inf
    burn_in: 0
    Rminus1_single_split: 4