timing: True
debug: False
stop_at_error: False
output: ./projects/cpip_data_challenge_2/chains/DV_STRONGBARYONS

likelihood:
  roman_real.cosmic_shear:
    use_emulator: 0
    path: ./projects/cpip_data_challenge_2/data
    data_file: DC2.dataset
    accuracyboost: 1.0
    integration_accuracy: 0
    lmax: 75000
    kmax_boltzmann: 7.5
    # 1 EE2, 2 Halofit
    non_linear_emul: 2
    IA_model: 0  # NLA (0) or TATT (1)
    IA_code: 0    # CFASTPT (0) or FASTPT (1) (only works if not NLA)
    IA_redshift_evolution: 3
    add_baryons_on_dv: True
    which_bsims_add_on_dv: "owls_AGN_t87"
    print_datavector: True
    print_datavector_file: "./projects/cpip_data_challenge_2/data/scale_cuts/STRONGBARYONS.modelvector"

params: !defaults
  - params_cosmo_lcdm
  - params_source_NLA

theory:
  camb:
    path: ./external_modules/code/CAMB
    stop_at_error: False
    use_renames: True
    extra_args:
      halofit_version: takahashi
      AccuracyBoost: 1.05
      lens_potential_accuracy: 1.0
      dark_energy_model: ppf
      accurate_massive_neutrino_transfers: false
      k_per_logint: 15
      kmax: 7.5

sampler:
  evaluate:
    N: 1
    override:
      As_1e9: 2.1
      ns: 0.96
      H0: 67
      omegab: 0.04
      omegam: 0.3
      mnu: 0.06
      roman_DZ_S1: 0.0
      roman_DZ_S2: 0.0
      roman_DZ_S3: 0.0
      roman_DZ_S4: 0.0
      roman_DZ_S5: 0.0
      roman_DZ_S6: 0.0
      roman_DZ_S7: 0.0
      roman_DZ_S8: 0.0
      roman_M1: 0.0
      roman_M2: 0.0
      roman_M3: 0.0
      roman_M4: 0.0
      roman_M5: 0.0
      roman_M6: 0.0
      roman_M7: 0.0
      roman_M8: 0.0
      roman_A1_1: 0.6
      roman_A1_2: -1.5
      roman_BARYON_Q1: 0